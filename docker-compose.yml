services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8082:5000"
    depends_on:
      - db # Tells Docker to start the database before the backend server

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rosegold_password
      MYSQL_DATABASE: rosegold_db
      MYSQL_USER: rosegold
      MYSQL_PASSWORD: rosegold_password
    ports:
      - "3307:3306"
    volumes:
      - sqldata:/var/lib/mysql # <-- CRITICAL: Persists your database data

volumes:
  sqldata:
