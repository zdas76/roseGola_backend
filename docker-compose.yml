services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - DOTENVX_DISABLE=true # Prevents your dotenvx layer from overriding Docker's injected variables
    ports:
      - "8082:5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - sqldata:/var/lib/mysql
    healthcheck:
      # Switched to string execution syntax to safely parse the variable execution
      test: mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqldata:
