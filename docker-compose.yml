services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile

    restart: unless-stopped

    env_file:
      - ./.env

    ports:
      - "8082:5000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql

    restart: unless-stopped

    environment:
      DATABASE_HOST: db
      DATABASE_PASSWORD: rosegold_password
      DATABASE_NAME: rosegold_db
      DATABASE_USER: rosegold

    ports:
      - "3307:3306"

    volumes:
      - sqldata:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prosegold_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqldata:
