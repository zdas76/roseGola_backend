services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8082:5000"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rosegold_password
      MYSQL_DATABASE: rosegold_db
      MYSQL_USER: rosegold
      MYSQL_PASSWORD: rosegold_password
    ports:
      - "3307:3306" # <--- Changed this line

volumes:
  sqldata:
